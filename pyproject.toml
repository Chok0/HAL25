[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halj"
version = "0.1.0"
description = "Jam generatif local : ecoute la guitare, genere un drone accorde et un rythme euclidien reactif"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Coeur volontairement leger : l'analyse DSP tourne en pur NumPy.
# librosa / aubio sont des backends optionnels (extra "mir"), pas des prerequis.
dependencies = [
    "numpy>=1.24",
    "python-osc>=1.8",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6"]
mir = ["librosa>=0.10", "aubio>=0.4.9"]
dev = ["pytest>=7.4"]

[project.scripts]
halj = "halj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
